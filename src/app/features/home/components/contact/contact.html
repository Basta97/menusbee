<section class="py-24 bg-[#FAFBFA] relative" id="contact">
    <div class="container mx-auto px-4 md:px-8 xl:px-16 text-right">

        <!-- Section Header -->
        <div class="mb-12">
            <h2 class="text-3xl md:text-4xl font-bold text-mu-dark mb-4 drop-shadow-sm">
                تواصل معنا في أي وقت
            </h2>
            <p class="text-mu-gray text-[1.1rem] font-medium">
                فريق الدعم متاح 24/7 للرد على استفساراتك ومساعدتك خطوة بخطوة
            </p>
        </div>

        <!-- Two Column Layout: Form (Right) and Info (Left) -->
        <!-- We use flex-col-reverse on mobile so the form appears first, then row on desktop -->
        <div class="flex flex-col-reverse lg:flex-row gap-8 items-stretch">

            <!-- LEFT PANEL: Contact Information (Green Box) -->
            <div
                class="lg:w-1/3 bg-[#8CC63F] rounded-2xl p-8 md:p-10 flex flex-col shadow-lg shadow-[#8CC63F]/20 relative overflow-hidden">
                <h3 class="text-2xl font-bold text-white mb-10 text-center">نحن هنا لمساعدتك</h3>

                <div class="space-y-6 flex-1">
                    <!-- Phone -->
                    <div
                        class="bg-white/10 hover:bg-white/20 transition-colors duration-300 rounded-xl p-4 flex items-center justify-between group cursor-pointer backdrop-blur-sm">
                        <div class="text-right">
                            <h4 class="text-white font-bold mb-1 text-lg">الهاتف</h4>
                            <p class="text-white/90 text-left font-sans font-medium" dir="ltr">+21040991525</p>
                        </div>
                        <div
                            class="w-14 h-14 bg-white rounded-xl flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-300">
                            <!-- Phone Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#8CC63F" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                        </div>
                    </div>

                    <!-- WhatsApp -->
                    <div
                        class="bg-white/10 hover:bg-white/20 transition-colors duration-300 rounded-xl p-4 flex items-center justify-between group cursor-pointer backdrop-blur-sm">
                        <div class="text-right">
                            <h4 class="text-white font-bold mb-1 text-lg">واتس اب</h4>
                            <p class="text-white/90 text-left font-sans font-medium" dir="ltr">+201094471044</p>
                        </div>
                        <div
                            class="w-14 h-14 bg-white rounded-xl flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-300">
                            <!-- WhatsApp Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#8CC63F" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                        </div>
                    </div>

                    <!-- Email -->
                    <div
                        class="bg-white/10 hover:bg-white/20 transition-colors duration-300 rounded-xl p-4 flex items-center justify-between group cursor-pointer backdrop-blur-sm">
                        <div class="text-right">
                            <h4 class="text-white font-bold mb-1 text-lg">البريد الإلكتروني</h4>
                            <p class="text-white/90 text-left font-sans font-medium" dir="ltr">Hi&#64;menusbee.com</p>
                        </div>
                        <div
                            class="w-14 h-14 bg-white rounded-xl flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-300">
                            <!-- Email Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#8CC63F" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="mt-12 flex flex-col items-center">
                    <h4 class="text-white font-bold text-xl mb-4">تابعنا على</h4>
                    <div class="flex items-center gap-3">
                        <a href="#"
                            class="w-10 h-10 border border-white/40 rounded-lg flex items-center justify-center text-white hover:bg-white hover:text-[#8CC63F] transition-all overflow-hidden relative group">
                            <!-- TikTok -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="relative z-10">
                                <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                            </svg>
                        </a>
                        <a href="#"
                            class="w-10 h-10 border border-white/40 rounded-lg flex items-center justify-center text-white hover:bg-white hover:text-[#8CC63F] transition-all overflow-hidden relative group">
                            <!-- Instagram -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="relative z-10">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                            </svg>
                        </a>
                        <a href="#"
                            class="w-10 h-10 border border-white/40 rounded-lg flex items-center justify-center text-white hover:bg-white hover:text-[#8CC63F] transition-all overflow-hidden relative group">
                            <!-- Facebook -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="relative z-10">
                                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Contact Form -->
            <div
                class="lg:w-2/3 bg-white rounded-2xl p-8 md:p-12 shadow-[0_10px_40px_rgba(0,0,0,0.04)] border border-gray-100 flex-1">
                <form class="space-y-6">

                    <!-- Name Input -->
                    <div>
                        <label class="block text-mu-dark font-bold mb-2 text-right">الاسم <span
                                class="text-red-500">*</span></label>
                        <input type="text" placeholder="اكتب اسمك كاملاً"
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3.5 text-right focus:outline-none focus:ring-2 focus:ring-mu-primary focus:border-transparent transition-all placeholder:text-gray-400">
                    </div>

                    <!-- Email Input -->
                    <div>
                        <label class="block text-mu-dark font-bold mb-2 text-right">البريد الإلكتروني <span
                                class="text-red-500">*</span></label>
                        <input type="email" placeholder="example@email.com" dir="ltr"
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3.5 text-left focus:outline-none focus:ring-2 focus:ring-mu-primary focus:border-transparent transition-all placeholder:text-gray-400">
                    </div>

                    <!-- Phone Input with Prefix -->
                    <div>
                        <label class="block text-mu-dark font-bold mb-2 text-right">رقم الهاتف <span
                                class="text-red-500">*</span></label>
                        <!-- A flex container to hold the prefix dropdown/flag and the input together -->
                        <div class="flex items-center bg-[#f8fafc] border border-gray-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-mu-primary focus-within:border-transparent transition-all"
                            dir="ltr">
                            <div
                                class="flex items-center gap-2 px-4 py-3.5 border-r border-gray-200 bg-[#f1f5f9] cursor-pointer hover:bg-gray-200 transition-colors">
                                <!-- Simple CSS Egyptian Flag representation -->
                                <div
                                    class="w-6 h-4 flex flex-col rounded-[2px] overflow-hidden shadow-sm shadow-gray-300">
                                    <div class="h-1/3 bg-red-600"></div>
                                    <div class="h-1/3 bg-white relative flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 bg-[#ce1126] rounded-full scale-y-75"></div>
                                        <!-- Eagle approximation -->
                                    </div>
                                    <div class="h-1/3 bg-black"></div>
                                </div>
                                <span class="text-sm font-bold text-gray-700">+20</span>
                            </div>
                            <input type="tel" placeholder="1234567890"
                                class="flex-1 bg-transparent px-4 py-3.5 text-left focus:outline-none placeholder:text-gray-400">
                        </div>
                    </div>

                    <!-- Message Input -->
                    <div>
                        <label class="block text-mu-dark font-bold mb-2 text-right">كيف يمكننا مساعدتك؟ <span
                                class="text-red-500">*</span></label>
                        <textarea rows="4" placeholder="اكتب رسالتك أو استفسارك هنا..."
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3.5 text-right focus:outline-none focus:ring-2 focus:ring-mu-primary focus:border-transparent transition-all placeholder:text-gray-400 resize-y"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full bg-[#75A536] hover:bg-mu-primary text-white font-bold py-4 px-6 rounded-xl transition-colors duration-300 shadow-lg shadow-mu-primary/20 mt-4">
                        إرسال الرسالة
                    </button>

                </form>
            </div>

        </div>
    </div>
</section>
