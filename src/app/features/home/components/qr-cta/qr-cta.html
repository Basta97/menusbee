<section class="py-24 bg-gradient-to-br from-mu-light via-white to-green-50/30 overflow-hidden">
    <div class="container mx-auto px-4 md:px-8 xl:px-16">
        <div
            class="relative bg-white rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.06)] p-10 md:p-14 flex flex-col md:flex-row items-center gap-10 md:gap-16 overflow-hidden">

            <!-- Decorative background pattern -->
            <div class="absolute top-0 left-0 w-40 h-40 bg-mu-primary/5 rounded-full -translate-x-1/2 -translate-y-1/2">
            </div>
            <div
                class="absolute bottom-0 right-0 w-56 h-56 bg-mu-primary/5 rounded-full translate-x-1/3 translate-y-1/3">
            </div>

            <!-- QR Icon Illustration -->
            <div class="relative shrink-0 order-1 md:order-2">
                <div
                    class="w-48 h-48 md:w-56 md:h-56 bg-gradient-to-br from-mu-primary/10 to-mu-primary/5 rounded-2xl flex items-center justify-center relative">
                    <!-- QR Code Icon -->
                    <svg class="w-24 h-24 md:w-28 md:h-28 text-mu-primary" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>

                    <!-- Floating badge -->
                    <div
                        class="absolute -top-3 -right-3 bg-mu-primary text-white text-xs font-bold py-1.5 px-4 rounded-full shadow-lg shadow-mu-primary/30">
                        مجاني 🎉
                    </div>

                    <!-- Scan animation ring -->
                    <div
                        class="absolute inset-0 rounded-2xl border-2 border-mu-primary/20 animate-ping [animation-duration:3s]">
                    </div>
                </div>
            </div>

            <!-- Text Content -->
            <div class="flex-1 text-center md:text-right relative z-10 order-2 md:order-1">
                <div
                    class="inline-block bg-mu-primary/10 text-mu-primary text-xs font-bold py-1.5 px-4 rounded-full mb-4">
                    ✨ أداة مجانية
                </div>
                <h2 class="text-[1.6rem] md:text-[2rem] font-bold text-mu-dark leading-[1.4] mb-4">
                    أنشئ <span class="text-mu-primary">QR Code</span> لمنيو مطعمك الآن
                </h2>
                <p class="text-mu-gray text-[0.95rem] md:text-[1.05rem] leading-[1.8] mb-8 max-w-xl">
                    حوّل رابط المنيو الإلكتروني إلى كود QR احترافي بخطوة واحدة — خصّص الألوان وأضف شعارك وحمّله كصورة
                    جاهزة للطباعة مجاناً بدون تسجيل
                </p>

                <div class="flex flex-col sm:flex-row items-center justify-center md:justify-end gap-4">
                    <a href="/qr-generator"
                        class="mu-btn mu-btn-primary !px-10 !py-3.5 text-base font-bold gap-2 w-full sm:w-auto">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                        </svg>
                        جرّب الآن مجاناً
                    </a>
                </div>

                <!-- Feature pills -->
                <div class="flex flex-wrap items-center justify-center md:justify-end gap-3 mt-6">
                    <span class="text-xs text-mu-gray font-medium bg-mu-light rounded-full py-1.5 px-3">🎨 ألوان
                        مخصصة</span>
                    <span class="text-xs text-mu-gray font-medium bg-mu-light rounded-full py-1.5 px-3">🖼️ أضف
                        شعارك</span>
                    <span class="text-xs text-mu-gray font-medium bg-mu-light rounded-full py-1.5 px-3">📥 تحميل
                        PNG</span>
                    <span class="text-xs text-mu-gray font-medium bg-mu-light rounded-full py-1.5 px-3">🚫 بدون
                        تسجيل</span>
                </div>
            </div>

        </div>
    </div>
</section>
